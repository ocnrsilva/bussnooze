
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BusSnooze - Alarme de Proximidade</title>
    
    <meta name="description" content="Alarme inteligente de proximidade para transporte público.">
    <meta name="theme-color" content="#2563eb">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-container { width: 100%; height: 100%; z-index: 1; background: #0f172a; }
        body { 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: contain;
            background-color: #020617;
        }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        /* Garante que o root ocupe a tela toda para evitar tela preta parcial */
        #root { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">
    <div id="root">
        <!-- Loader inicial para evitar tela preta durante o parse do JS -->
        <div style="display:flex; height:100vh; width:100vw; align-items:center; justify-content:center; background:#020617; color:#3b82f6; font-family:sans-serif; flex-direction:column; gap:1rem;">
            <div style="width:40px; height:40px; border:4px solid #1e293b; border-top:4px solid #3b82f6; border-radius:50%; animation: spin 1s linear infinite;"></div>
            <span style="font-weight:bold; letter-spacing:0.1em; font-size:12px;">BUSSNOOZE CARREGANDO...</span>
        </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    
    <!-- Ponto de entrada explícito -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
